# memory_hardening plugin manifest.
#
# The framework parses ONLY these keys (helpers/plugins.py PluginMetadata):
# name, title, description, version, settings_sections, per_project_config,
# per_agent_config, always_enabled. There is no model_config, so anything else
# is silently dropped at runtime.
#
# `author`, `license` and `homepage` were removed in v0.7.0 for that reason.
# They are useful repository metadata, but not here: a manifest that appears
# to carry fields the framework reads is worse than one that does not. They
# belong in README.md (which is where a store reviewer will look).
#
# settings_sections drives discoverability: only `agent` and `external` mount
# the plugin settings subsection in the WebUI.
#
# Zero source modifications to plugins/_memory/ — purely additive extension
# hooks and helper modules.
name: memory_hardening
title: Memory Hardening
description: |
  Wraps the built-in `_memory` plugin with resilience, observability, and
  circuit-breaker protection against FAISS recall timeouts, leaked asyncio
  tasks, stuck memorize threads, and unbounded index caches.

  Phase 4 adds a coroutine-leak guard plus a UI-loop pulse consumed by
  `_model_fallback` to keep the WebSocket dispatcher alive during multi-hour
  provider outages. v0.5.0 merged the former `_memory_resilience` plugin: a
  history clamp capping the chat-history length the official `_memory` plugin
  sends to the utility model during memorize / solve, preventing
  ContextOverflow errors the cascade cannot recover from. v0.5.2 added a
  recall-wait guard wrapping `RecallWait.execute` so the 30s recall
  `asyncio.TimeoutError` can no longer propagate and kill the monologue loop.

  v0.7.0 makes the breakers actually break: a recall gate suppresses the
  FAISS call when the circuit breaker, the rate limiter, or a per-subdir
  breaker is tripped. Previously all three recorded telemetry and changed
  nothing, because nothing consumed the flags they set.
version: 0.7.0
settings_sections:
  - agent
per_project_config: false
per_agent_config: false
always_enabled: false
